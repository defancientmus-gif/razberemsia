<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Разберёмся v3.85</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Разберёмся">
<meta name="theme-color" content="#7a9e7e">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
:root{
  --sage:#7a9e7e;--sage-d:#4a6e4e;
  --cream:#f5f0e8;--warm:#ede5d8;--stone:#c4b8a8;
  --text:#1c1c1e;--text-m:#3a3a3c;--text-l:#6e6e73;
  --rose:#c0504a;--gold:#b8883a;--r:16px;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sys);background:var(--cream);color:var(--text);font-size:17px;line-height:1.5;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 10% 100%,rgba(122,158,126,0.12) 0%,transparent 60%),
  linear-gradient(165deg,#f7f3ec 0%,#efe9e0 55%,#e6dfd5 100%);}

/* APP */
.app{position:relative;z-index:10;height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-family:'Playfair Display',serif;font-size:21px;color:var(--text);white-space:nowrap;letter-spacing:-.3px;}
.logo-ver{font-size:9px;color:rgba(110,110,115,0.4);font-family:var(--sys);font-weight:500;margin-left:6px;vertical-align:middle;letter-spacing:.02em;}
.hcenter{display:flex;flex-direction:column;align-items:center;margin:0 auto;}
.hdate{font-size:11px;font-weight:500;color:var(--text-l);letter-spacing:.01em;}
.hclock{font-size:17px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.hbtn{width:38px;height:38px;border-radius:50%;background:rgba(122,158,126,0.11);border:1px solid rgba(122,158,126,0.24);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;padding:0;flex-shrink:0;transition:background .15s,transform .1s;}
.hbtn:active{background:rgba(122,158,126,0.22);transform:scale(.94);}
.hbtn.open{background:rgba(122,158,126,0.18);}
.hbtn svg{width:18px;height:18px;stroke:var(--sage-d);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* MENU */
.hmenu{position:fixed;top:64px;right:12px;z-index:500;background:rgba(255,255,255,0.95);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(200,195,188,0.5);border-radius:20px;padding:6px;min-width:220px;box-shadow:0 8px 40px rgba(0,0,0,0.12);opacity:0;pointer-events:none;transform:translateY(-8px) scale(.96);transition:opacity .18s,transform .18s cubic-bezier(.4,0,.2,1);}
@media(min-width:480px){.hmenu{right:calc(50% - 228px);}}
.hmenu.open{opacity:1;pointer-events:all;transform:translateY(0) scale(1);}
.hmenu-user{padding:12px 14px 10px;border-bottom:1px solid rgba(200,195,188,0.35);margin-bottom:4px;}
.hmenu-phone{font-size:12px;font-weight:500;color:var(--text-l);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.hmenu-name{font-size:17px;font-weight:600;color:var(--text);margin-top:2px;}
.hmenu-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;-webkit-appearance:none;background:none;border:none;width:100%;text-align:left;font-family:var(--sys);transition:background .1s;font-size:15px;}
.hmenu-item:active{background:rgba(0,0,0,0.06);}
.hmenu-ico{width:32px;height:32px;border-radius:9px;background:rgba(122,158,126,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hmenu-ico svg{width:16px;height:16px;stroke:var(--sage-d);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.hmenu-t{font-size:15px;font-weight:600;color:var(--text);}
.hmenu-s{font-size:12px;color:var(--text-l);margin-top:1px;}
.hmenu-sep{height:1px;background:rgba(200,195,188,0.35);margin:3px 6px;}
.hmenu-item.danger .hmenu-ico{background:rgba(192,80,74,0.09);}
.hmenu-item.danger .hmenu-ico svg{stroke:var(--rose);}
.hmenu-item.danger .hmenu-t{color:var(--rose);}

/* SCREENS */
.screens{flex:1;overflow:hidden;position:relative;}
.scr{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 36px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .24s cubic-bezier(.4,0,.2,1),transform .24s cubic-bezier(.4,0,.2,1);}
.scr.active{opacity:1;pointer-events:all;transform:translateY(0);}
.scr.sl{transform:translateX(-20px);opacity:0;}
.scr.sr{transform:translateX(20px);opacity:0;}
.scr::-webkit-scrollbar{display:none;}

/* HOME */
.greet-block{padding:8px 14px 12px;}
.greet-time{font-size:12px;font-weight:500;color:var(--text-l);letter-spacing:.01em;margin-bottom:3px;}
.greet-name{font-family:'Playfair Display',serif;font-size:30px;color:var(--text);margin-bottom:8px;line-height:1.2;letter-spacing:-.5px;}
.beta-pill{display:inline-flex;align-items:center;background:rgba(184,136,58,0.08);border:1px solid rgba(184,136,58,0.18);border-radius:50px;padding:4px 12px;font-size:11px;font-weight:500;color:var(--text-l);margin-bottom:14px;}

/* EMERGENCY */
.emer-card{background:linear-gradient(135deg,#8b3a36,#b8443e);border-radius:var(--r);padding:16px 20px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;-webkit-appearance:none;width:100%;text-align:left;font-family:var(--sys);border:none;box-shadow:0 4px 20px rgba(176,64,58,0.22);transition:transform .12s,box-shadow .12s;}
.emer-card:active{transform:scale(.97);box-shadow:0 2px 8px rgba(176,64,58,0.15);}
.emer-ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emer-ico svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.emer-title{font-size:17px;font-weight:700;color:#fff;margin-bottom:2px;letter-spacing:-.2px;}
.emer-sub{font-size:12px;color:rgba(255,255,255,0.75);font-weight:400;}

/* CARDS */
.cards-grid{display:flex;flex-direction:column;gap:8px;}
.acard{background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(200,195,188,0.5);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;-webkit-appearance:none;width:100%;text-align:left;font-family:var(--sys);transition:transform .12s,background .12s;}
.acard:active{background:rgba(122,158,126,0.1);transform:scale(.98);}
.acard-ico{width:46px;height:46px;border-radius:13px;background:rgba(122,158,126,0.1);border:1px solid rgba(122,158,126,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.acard-ico svg{width:22px;height:22px;stroke:var(--sage-d);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.acard-title{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-.2px;}
.acard-sub{font-size:14px;color:var(--text-m);margin-top:2px;font-weight:400;}
.acard-right{margin-left:auto;flex-shrink:0;}
.acard-right svg{width:16px;height:16px;stroke:var(--text-l);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* BACK */
.backrow{margin-bottom:12px;}
.backbtn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(200,195,188,0.48);border-radius:var(--r);padding:11px 16px;cursor:pointer;-webkit-appearance:none;font-family:var(--sys);width:100%;text-align:left;transition:background .12s;}
.backbtn:active{background:rgba(122,158,126,0.1);}
.back-ico svg{width:18px;height:18px;stroke:var(--sage-d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.back-lbl{font-size:17px;font-weight:600;color:var(--text);}
.back-hint{font-size:12px;color:var(--text-l);margin-top:1px;}

/* SECTION */
.sec-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--text);margin-bottom:4px;letter-spacing:-.4px;}
.sec-sub{font-size:14px;color:var(--text-m);margin-bottom:14px;line-height:1.5;}

/* EMERGENCY SCREEN */
.emg-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.emg-opt{background:rgba(255,255,255,0.78);border:1px solid rgba(200,195,188,0.48);border-radius:var(--r);padding:13px 16px;cursor:pointer;-webkit-appearance:none;font-family:var(--sys);text-align:left;width:100%;display:flex;align-items:center;gap:13px;transition:background .12s;}
.emg-opt:active{background:rgba(0,0,0,0.05);}
.emg-opt-ico{width:36px;height:36px;border-radius:10px;background:rgba(122,158,126,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.emg-opt-ico svg{width:18px;height:18px;stroke:var(--text-m);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.emg-opt-t{font-size:16px;font-weight:600;color:var(--text);}
.emg-rule{background:rgba(122,158,126,0.07);border:1px solid rgba(122,158,126,0.18);border-radius:var(--r);padding:16px 18px;}
.emg-rule-t{font-size:15px;font-weight:700;color:var(--sage-d);margin-bottom:7px;}
.emg-rule-i{font-size:14px;color:var(--text-m);line-height:1.8;}

/* ITEM CARDS */
.item-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(200,195,188,0.48);border-radius:var(--r);padding:13px 16px 13px 20px;margin-bottom:8px;position:relative;overflow:hidden;word-break:break-word;transition:transform .12s;}
.note-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.note-cat{font-size:10px;font-weight:600;color:var(--text-l);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.item-title{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.1px;}
.item-sub{font-size:13px;color:var(--text-m);margin-top:3px;line-height:1.5;}
.item-meta{font-size:11px;color:var(--text-l);margin-top:8px;font-weight:400;}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.act-btn{border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sys);-webkit-appearance:none;min-height:36px;border:1px solid transparent;transition:background .12s;}
.act-edit{background:rgba(122,158,126,0.12);color:var(--sage-d);border-color:rgba(122,158,126,0.25);}
.act-edit:active{background:rgba(122,158,126,0.22);}
.act-del{background:rgba(192,80,74,0.07);color:var(--rose);border-color:rgba(192,80,74,0.16);}
.act-del:active{background:rgba(192,80,74,0.14);}
.reminder-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(122,158,126,0.1);color:var(--sage-d);font-size:12px;font-weight:600;border-radius:50px;padding:4px 11px;border:1px solid rgba(122,158,126,0.2);margin-top:7px;cursor:pointer;-webkit-appearance:none;font-family:var(--sys);}
.reminder-tag svg{width:12px;height:12px;stroke:var(--sage-d);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* NOTIF BANNER */
.notif-banner{background:rgba(122,158,126,0.08);border:1px solid rgba(122,158,126,0.2);border-radius:var(--r);padding:13px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.notif-banner svg{width:20px;height:20px;stroke:var(--sage-d);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.notif-text{font-size:14px;color:var(--text-m);line-height:1.6;flex:1;}
.notif-allow-btn{background:var(--sage);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sys);flex-shrink:0;-webkit-appearance:none;}

/* CALENDAR TRIGGER */
.cal-trigger{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(200,195,188,0.48);border-radius:var(--r);padding:12px 16px;margin-bottom:10px;cursor:pointer;-webkit-appearance:none;width:100%;font-family:var(--sys);transition:background .12s;}
.cal-trigger:active{background:rgba(0,0,0,0.05);}
.cal-trigger-ico{width:36px;height:36px;border-radius:10px;background:rgba(122,158,126,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cal-trigger-ico svg{width:18px;height:18px;stroke:var(--sage-d);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cal-trigger-label{font-size:11px;font-weight:600;color:var(--text-l);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1px;}
.cal-trigger-val{font-size:16px;font-weight:600;color:var(--text);}
.cal-arr{margin-left:auto;opacity:.35;}
.cal-arr svg{width:15px;height:15px;stroke:var(--text);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* CALENDAR POPUP */
.cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.38);z-index:400;display:none;align-items:flex-end;justify-content:center;}
.cal-overlay.open{display:flex;animation:fIn .16s ease;}
.cal-popup{background:#f4f0e9;border-radius:24px 24px 0 0;padding:0 0 48px;width:100%;max-width:480px;animation:sUp .22s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.cal-popup-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;}
.cal-popup-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);letter-spacing:-.3px;}
.cal-popup-close{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.07);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;}
.cal-popup-close svg{width:16px;height:16px;stroke:var(--text-m);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cal-month-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;}
.cal-month-label{font-size:17px;font-weight:700;color:var(--text);cursor:pointer;}
.cal-nav{width:36px;height:36px;border-radius:50%;background:rgba(122,158,126,0.1);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;transition:background .12s;}
.cal-nav:active{background:rgba(122,158,126,0.22);}
.cal-nav svg{width:17px;height:17px;stroke:var(--sage-d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cal-days-head{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;margin-bottom:4px;}
.cal-day-name{text-align:center;font-size:12px;font-weight:600;color:var(--text-l);padding:4px 0;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px;}
.cal-day{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;-webkit-appearance:none;background:none;border:none;font-family:var(--sys);transition:background .1s;position:relative;}
.cal-day:active{background:rgba(122,158,126,0.14);}
.cal-day.other{color:rgba(110,110,115,0.4);}
.cal-day.today{font-weight:700;color:var(--sage-d);}
.cal-day.today::after{content:'';position:absolute;inset:2px;border-radius:10px;border:2px solid var(--sage-d);pointer-events:none;}
.cal-day.sel{background:var(--sage);color:#fff;font-weight:700;}
.cal-day.sel::after{display:none;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:2px;}
.cal-day.sel .cal-dot{background:rgba(255,255,255,0.8);}
.cal-done-btn{display:block;margin:16px 20px 0;width:calc(100% - 40px);background:var(--sage);color:#fff;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;font-family:var(--sys);-webkit-appearance:none;}
.cal-done-btn:active{background:var(--sage-d);}

/* YEAR PICKER */
.year-picker{padding:12px 20px 0;max-height:240px;overflow-y:auto;display:none;flex-wrap:wrap;gap:6px;}
.year-picker.open{display:flex;}
.year-btn{flex:0 0 calc(25% - 5px);background:rgba(122,158,126,0.08);border:1px solid rgba(122,158,126,0.18);border-radius:10px;padding:8px 4px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;-webkit-appearance:none;font-family:var(--sys);text-align:center;transition:background .1s;}
.year-btn:active,.year-btn.cur{background:var(--sage);color:#fff;border-color:var(--sage);}

/* NOTES STAT */
.notes-stat{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.notes-stat::-webkit-scrollbar{display:none;}
.stat-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.75);border:1px solid rgba(200,195,188,0.46);border-radius:50px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text-m);cursor:pointer;-webkit-appearance:none;font-family:var(--sys);transition:background .12s;}
.stat-chip:active,.stat-chip.active{background:var(--sage);color:#fff;border-color:var(--sage);}
.stat-chip.active .stat-dot{background:rgba(255,255,255,0.8);}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.stat-count{font-size:11px;font-weight:700;opacity:.7;}

/* ADD */
.add-dashed{background:transparent;border:1.5px dashed rgba(200,195,188,0.55);border-radius:var(--r);padding:14px;width:100%;font-size:16px;font-weight:600;color:var(--text-l);cursor:pointer;font-family:var(--sys);-webkit-appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:background .12s;margin-top:2px;}
.add-dashed:active{background:rgba(122,158,126,0.07);}

/* NOTEPAD */
.notepad-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;background:rgba(248,244,237,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(200,195,188,0.35);flex-shrink:0;}
.notepad-mic{width:40px;height:40px;border-radius:50%;background:rgba(122,158,126,0.12);border:1.5px solid rgba(122,158,126,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;color:var(--sage-d);flex-shrink:0;transition:all .14s;}
.notepad-mic:active{transform:scale(.92);}
.notepad-mic.rec{background:rgba(192,80,74,0.12);border-color:rgba(192,80,74,0.32);color:var(--rose);animation:pulse-mic 1.2s ease-in-out infinite;}
@keyframes pulse-mic{0%,100%{box-shadow:0 0 0 0 rgba(192,80,74,0.3)}50%{box-shadow:0 0 0 6px rgba(192,80,74,0)}}
.notepad-field{flex:1;background:rgba(255,255,255,0.9);border:1.5px solid rgba(200,195,188,0.48);border-radius:20px;padding:10px 16px;font-size:16px;font-family:var(--sys);color:var(--text);outline:none;resize:none;min-height:40px;max-height:120px;line-height:1.5;-webkit-user-select:text;user-select:text;transition:border-color .15s;}
.notepad-field::placeholder{color:var(--stone);}
.notepad-field:focus{border-color:rgba(122,158,126,0.5);}
.notepad-send{width:40px;height:40px;border-radius:50%;background:var(--sage);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;flex-shrink:0;transition:background .12s,transform .1s;}
.notepad-send:active{background:var(--sage-d);transform:scale(.92);}
.voice-status{display:none;text-align:center;padding:7px;font-size:13px;color:var(--rose);font-weight:600;flex-shrink:0;letter-spacing:.01em;}
.pad-item{background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(200,195,188,0.46);border-radius:var(--r);padding:12px 16px 12px 20px;margin-bottom:8px;position:relative;overflow:hidden;word-break:break-word;}
.pad-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.pad-cat{font-size:10px;font-weight:600;color:var(--text-l);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.pad-title{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.1px;margin-bottom:2px;}
.pad-text{font-size:14px;color:var(--text-m);line-height:1.6;}
.pad-meta{font-size:11px;color:var(--text-l);margin-top:7px;}
