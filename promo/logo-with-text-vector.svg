<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Разберемся - векторный логотип</title>
  <desc id="desc">Стеклянная светлая плитка с синим знаком в форме буквы Р и листа и надписью азберемся.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf2ff"/>
      <stop offset="0.48" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#8fbaf5"/>
    </linearGradient>
    <radialGradient id="backgroundGlow" cx="46%" cy="40%" r="71%">
      <stop stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.48" stop-color="#f5f9ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b6d1fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0.07" y1="0" x2="0.9" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#f1f6ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#dae8ff" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#7baeff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7ab5ff"/>
      <stop offset="0.42" stop-color="#4b8cf0"/>
      <stop offset="1" stop-color="#1554cb"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#b2d6ff"/>
      <stop offset="0.48" stop-color="#73aaf6"/>
      <stop offset="1" stop-color="#1951bf"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5292ef"/>
      <stop offset="1" stop-color="#1d58c7"/>
    </linearGradient>
    <filter id="largeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#3c76ca" flood-opacity="0.29"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="markShadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#326bcc" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.78"/>
    </filter>
    <filter id="wordShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#234f9e" flood-opacity="0.2"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="103" y="96" width="1048" height="1006" rx="171"/>
    </clipPath>
  </defs>

  <g id="background-layer">
    <rect width="1254" height="1254" fill="url(#background)"/>
    <rect width="1254" height="1254" fill="url(#backgroundGlow)"/>
    <ellipse cx="637" cy="1086" rx="488" ry="54" fill="#326ec5" fill-opacity="0.22" filter="url(#largeShadow)"/>
  </g>

  <g id="glass-tile" filter="url(#tileShadow)">
    <rect x="103" y="96" width="1048" height="1006" rx="171" fill="url(#tile)"/>
    <rect x="103" y="96" width="1048" height="1006" rx="171" fill="none" stroke="url(#tileRim)" stroke-width="7"/>
    <rect x="112" y="105" width="1030" height="988" rx="163" fill="none" stroke="#ffffff" stroke-opacity="0.47" stroke-width="2"/>
    <g clip-path="url(#tileClip)">
      <ellipse cx="379" cy="196" rx="426" ry="208" fill="#ffffff" fill-opacity="0.25" filter="url(#largeShadow)"/>
      <path d="M143 182 C382 100 820 106 1115 178" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6"/>
    </g>
  </g>

  <g id="logo-mark" filter="url(#markShadow)">
    <path id="letter-p" d="M339 934 V298 H604 C737 298 813 373 813 503 C813 633 730 711 600 711 H525 L578 666 H601 C697 666 758 606 758 503 C758 404 699 344 603 344 H392 V799 C383 848 364 897 339 934 Z" fill="url(#mark)" stroke="#2369de" stroke-width="2"/>
    <path d="M341 299 L391 345 H603 C699 345 758 404 758 503" fill="none" stroke="#b7ddff" stroke-opacity="0.62" stroke-width="3"/>
    <path id="leaf" d="M386 834 C402 697 448 582 539 522 C608 477 653 450 671 401 C684 516 659 614 597 671 C553 711 501 725 454 757 C423 779 401 807 386 834 Z" fill="url(#leaf)" stroke="#d9efff" stroke-width="2"/>
    <path id="leaf-vein" d="M388 830 C421 742 469 671 567 587 C490 622 427 692 388 830 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M390 827 C431 724 492 652 568 587" fill="none" stroke="#d9efff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="wordmark" filter="url(#wordShadow)">
    <text x="461" y="865" fill="url(#wordmark)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="350" letter-spacing="0">азберемся</text>
    <text x="461" y="863" fill="none" stroke="#b6dbff" stroke-opacity="0.36" stroke-width="1" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="350" letter-spacing="0">азберемся</text>
  </g>
</svg>
