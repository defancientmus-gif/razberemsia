<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Город недели</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2428;
      --muted: #667074;
      --paper: #f7f2df;
      --panel: rgba(255, 253, 246, .92);
      --line: rgba(31, 36, 40, .16);
      --green: #73a86d;
      --grass: #b9d68a;
      --water: #78b8c7;
      --home: #de735f;
      --work: #557fc2;
      --city: #d7aa45;
      --hospital: #70a879;
      --park: #8f75b9;
      --shadow: 0 18px 45px rgba(31, 36, 40, .18);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.7), transparent 28%),
        linear-gradient(135deg, #dce9bd 0%, #f5e9c7 54%, #d5e5ea 100%);
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 390px;
      gap: 18px;
      padding: 18px;
    }

    .world-wrap {
      position: relative;
      min-height: calc(100vh - 36px);
      border: 1px solid rgba(31, 36, 40, .18);
      border-radius: 8px;
      overflow: hidden;
      background: linear-gradient(#a9d2e2 0%, #d9eddb 38%, #b7d582 100%);
      box-shadow: var(--shadow);
    }

    .hud {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 14px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(31px, 5vw, 66px);
      line-height: .88;
      letter-spacing: 0;
      text-shadow: 0 2px 0 rgba(255,255,255,.65);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 380px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(31, 36, 40, .14);
      border-radius: 999px;
      background: rgba(255, 253, 246, .82);
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(31,36,40,.08);
      backdrop-filter: blur(8px);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 36px);
      touch-action: manipulation;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      z-index: 5;
      max-width: min(580px, calc(100% - 32px));
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }

    .hint span {
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 253, 246, .82);
      border: 1px solid rgba(31,36,40,.12);
      color: var(--muted);
      font-size: 13px;
      box-shadow: 0 10px 24px rgba(31,36,40,.08);
    }

    .side {
      display: grid;
      align-content: start;
      gap: 12px;
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(31, 36, 40, .12);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.35);
    }

    .panel h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
    }

    .panel-body {
      padding: 14px;
    }

    .place-copy {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .bars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 13px;
    }

    .meter {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(31,36,40,.11);
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--ink);
    }

    .notes {
      display: grid;
      gap: 8px;
    }

    .note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 42px;
      padding: 10px;
      border: 1px solid rgba(31,36,40,.13);
      border-radius: 8px;
      background: rgba(255,255,255,.65);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.32;
    }

    .note input {
      margin-top: 2px;
      accent-color: var(--ink);
    }

    .note.done {
      color: var(--muted);
      background: rgba(255,255,255,.38);
      text-decoration: line-through;
    }

    .quick-form {
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 8px;
      margin-top: 12px;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      color: var(--ink);
      padding: 10px;
    }

    textarea {
      min-height: 42px;
      resize: vertical;
    }

    .solid {
      min-height: 42px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .ghost {
      min-height: 40px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.72);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
    }

    .day {
      min-height: 116px;
      padding: 7px;
      display: grid;
      align-content: start;
      gap: 6px;
      border: 1px solid rgba(31,36,40,.13);
      border-radius: 8px;
      background: rgba(255,255,255,.65);
      text-align: left;
    }

    .day.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .day strong {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .event {
      display: block;
      border-radius: 6px;
      padding: 6px;
      color: #fff;
      font-size: 11px;
      line-height: 1.22;
      word-break: break-word;
    }

    .event.home { background: var(--home); }
    .event.work { background: var(--work); }
    .event.city { background: var(--city); color: #2d250f; }
    .event.hospital { background: var(--hospital); }
    .event.park { background: var(--park); }

    .log {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.34;
    }

    @media (max-width: 1040px) {
      .app {
        grid-template-columns: 1fr;
      }

      .world-wrap,
      canvas {
        min-height: 620px;
      }
    }

    @media (max-width: 660px) {
      .app {
        padding: 10px;
      }

      .world-wrap,
      canvas {
        min-height: 530px;
      }

      .hud {
        flex-direction: column;
      }

      .chips {
        justify-content: flex-start;
      }

      .week {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .actions,
      .quick-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="world-wrap" aria-label="Игровой город">
      <div class="hud">
        <h1>Город<br>недели</h1>
        <div class="chips">
          <span class="chip" id="dayChip">Понедельник</span>
          <span class="chip" id="energyChip">Энергия 72</span>
          <span class="chip" id="planChip">3 дела</span>
        </div>
      </div>
      <canvas id="world" width="1200" height="860" aria-label="3D город с локациями"></canvas>
      <div class="hint">
        <span>Клик по зданию ведет персонажа туда</span>
        <span>Двойной клик по заметке добавляет ее в текущий день</span>
        <span>Город живет: люди, машины, вода, птицы и свет</span>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head">
          <h2 id="locationTitle">Дом</h2>
          <span class="chip" id="locationType">восстановление</span>
        </div>
        <div class="panel-body">
          <p class="place-copy" id="locationText"></p>
          <div class="bars">
            <label class="meter">Фокус
              <span class="bar"><span id="focusBar"></span></span>
            </label>
            <label class="meter">Нагрузка
              <span class="bar"><span id="loadBar"></span></span>
            </label>
          </div>
          <div class="notes" id="notes"></div>
          <form class="quick-form" id="noteForm">
            <textarea id="noteInput" rows="2" placeholder="Новая заметка для места"></textarea>
            <button class="solid" type="submit">Добавить</button>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>План недели</h2>
          <select id="daySelect" aria-label="День недели">
            <option value="0">Пн</option>
            <option value="1">Вт</option>
            <option value="2">Ср</option>
            <option value="3">Чт</option>
            <option value="4">Пт</option>
            <option value="5">Сб</option>
            <option value="6">Вс</option>
          </select>
        </div>
        <div class="panel-body">
          <div class="actions">
            <button class="ghost" data-action="plan">Запланировать</button>
            <button class="ghost" data-action="advance">День дальше</button>
            <button class="ghost" data-action="reset">Сброс</button>
          </div>
          <div class="week" id="week" aria-label="Неделя"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Журнал</h2>
          <span class="chip">город отвечает</span>
        </div>
        <div class="panel-body">
          <div class="log" id="log"></div>
        </div>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector("#world");
    const ctx = canvas.getContext("2d");
    const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
    const shortDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

    const locations = [
      {
        id: "home",
        title: "Дом",
        kind: "восстановление",
        text: "База персонажа: сон, еда, уборка, личные ритуалы и подготовка к неделе.",
        grid: { x: -4, y: -2 },
        color: "#de735f",
        roof: "#b94e46",
        focus: 58,
        load: 28,
        notes: ["Закупить продукты на 3 дня", "Собрать вечерний ритуал без телефона"]
      },
      {
        id: "work",
        title: "Работа",
        kind: "глубокий фокус",
        text: "Башня задач, созвонов и дедлайнов. Здесь удобно ставить фокус-блоки.",
        grid: { x: 2, y: -4 },
        color: "#557fc2",
        roof: "#3f5f9a",
        focus: 88,
        load: 76,
        notes: ["Сделать черновик презентации", "Разобрать входящие до 20 минут"]
      },
      {
        id: "city",
        title: "Город",
        kind: "дела снаружи",
        text: "Площадь поручений: документы, покупки, встречи, дорога и неожиданные окна.",
        grid: { x: 0, y: 0 },
        color: "#d7aa45",
        roof: "#b98728",
        focus: 44,
        load: 61,
        notes: ["Забрать заказ", "Оплатить счета"]
      },
      {
        id: "hospital",
        title: "Больница",
        kind: "здоровье",
        text: "Квартал заботы о теле: записи, анализы, лекарства и профилактика.",
        grid: { x: 4, y: 2 },
        color: "#70a879",
        roof: "#4f8159",
        focus: 51,
        load: 69,
        notes: ["Записаться к терапевту", "Проверить аптечку"]
      },
      {
        id: "park",
        title: "Парк",
        kind: "пауза",
        text: "Зеленая зона для прогулок, спорта и восстановления между обязательствами.",
        grid: { x: -3, y: 3 },
        color: "#8f75b9",
        roof: "#6f5995",
        focus: 38,
        load: 18,
        notes: ["30 минут прогулки", "Позвонить другу по дороге"]
      }
    ];

    const decor = [
      { type: "tree", x: -5.3, y: 1.2, s: 1.1 },
      { type: "tree", x: -4.5, y: 2.5, s: .85 },
      { type: "tree", x: -2.2, y: 4.2, s: 1.2 },
      { type: "tree", x: -1.4, y: 3.1, s: .8 },
      { type: "tree", x: 1.8, y: 2.9, s: .95 },
      { type: "tree", x: 3.2, y: -1.7, s: .75 },
      { type: "tree", x: -6.1, y: 2.7, s: .78 },
      { type: "tree", x: 2.4, y: 3.9, s: .88 },
      { type: "tree", x: 5.5, y: 1.6, s: .7 },
      { type: "rock", x: -5.8, y: -1, s: 1 },
      { type: "rock", x: 5.1, y: .4, s: .9 },
      { type: "flower", x: -2.8, y: 1.5, s: 1 },
      { type: "flower", x: 1.3, y: -2.3, s: 1 },
      { type: "bench", x: -3.6, y: 3.7, s: 1 },
      { type: "lamp", x: -1.4, y: -.8, s: 1 },
      { type: "lamp", x: 1.7, y: .8, s: 1 },
      { type: "fountain", x: -.45, y: .55, s: 1 }
    ];

    let selected = locations[0];
    let currentDay = 0;
    let energy = 72;
    let events = [
      { day: 0, location: "work", text: "Фокус-блок 10:00" },
      { day: 2, location: "hospital", text: "Здоровье без спешки" },
      { day: 5, location: "park", text: "Длинная прогулка" }
    ];
    let hoverId = "";
    let time = 0;
    let scene = { w: 1200, h: 860, tileW: 96, tileH: 50, ox: 600, oy: 420, cameraX: 0, cameraY: 0 };
    let player = { gridX: -4, gridY: -2, targetX: -4, targetY: -2, step: 0, trail: [] };
    let walkers = [
      { x: -1, y: -3.2, phase: .2, color: "#374151" },
      { x: 3.4, y: -.8, phase: 1.7, color: "#7c3aed" },
      { x: -2.7, y: 1.7, phase: 3.1, color: "#b45309" },
      { x: 1.2, y: 3.3, phase: 4.4, color: "#0f766e" },
      { x: -4.1, y: -.7, phase: 5.2, color: "#be123c" },
      { x: 2.2, y: -2.4, phase: 2.8, color: "#2563eb" }
    ];
    const vehicles = [
      { route: [[-5, -2], [-2, -1], [0, 0], [2, -4]], t: .08, speed: .0009, color: "#f97316" },
      { route: [[4, 2], [2, 1], [0, 0], [-3, 3]], t: .46, speed: .0007, color: "#14b8a6" },
      { route: [[2, -4], [0, 0], [2, 1], [4, 2]], t: .72, speed: .00062, color: "#ef4444" }
    ];
    const birds = [
      { x: .12, y: .22, speed: .00013, phase: 0 },
      { x: .66, y: .16, speed: .0001, phase: 2.4 },
      { x: .38, y: .29, speed: .00008, phase: 4.1 }
    ];
    const clouds = [
      { x: .08, y: .11, s: 1.2, speed: .000035 },
      { x: .68, y: .18, s: .85, speed: .000025 },
      { x: .42, y: .08, s: .95, speed: .00003 }
    ];
    const particles = [
      { x: -3.4, y: 3.1, phase: .2 },
      { x: -2.5, y: 3.5, phase: 1.6 },
      { x: 0, y: .15, phase: 2.1 },
      { x: 4.4, y: 1.8, phase: 3.4 },
      { x: 2.4, y: -4.2, phase: 4.9 }
    ];

    const els = {
      title: document.querySelector("#locationTitle"),
      type: document.querySelector("#locationType"),
      text: document.querySelector("#locationText"),
      focusBar: document.querySelector("#focusBar"),
      loadBar: document.querySelector("#loadBar"),
      notes: document.querySelector("#notes"),
      noteForm: document.querySelector("#noteForm"),
      noteInput: document.querySelector("#noteInput"),
      week: document.querySelector("#week"),
      daySelect: document.querySelector("#daySelect"),
      dayChip: document.querySelector("#dayChip"),
      energyChip: document.querySelector("#energyChip"),
      planChip: document.querySelector("#planChip"),
      log: document.querySelector("#log")
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scene.w = rect.width;
      scene.h = rect.height;
      scene.tileW = Math.max(62, Math.min(110, rect.width / 10));
      scene.tileH = scene.tileW * .52;
      scene.ox = rect.width * .5;
      scene.oy = rect.height * .52;
    }

    function iso(x, y, z = 0) {
      return {
        x: scene.ox + scene.cameraX + (x - y) * scene.tileW * .5,
        y: scene.oy + scene.cameraY + (x + y) * scene.tileH * .5 - z
      };
    }

    function gridFromPointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left - scene.ox - scene.cameraX;
      const y = clientY - rect.top - scene.oy - scene.cameraY;
      return {
        x: y / scene.tileH + x / scene.tileW,
        y: y / scene.tileH - x / scene.tileW
      };
    }

    function closestLocation(point) {
      let winner = null;
      let distance = Infinity;
      for (const location of locations) {
        const dx = point.x - location.grid.x;
        const dy = point.y - location.grid.y;
        const score = Math.sqrt(dx * dx + dy * dy);
        if (score < distance) {
          distance = score;
          winner = location;
        }
      }
      return distance < 1.05 ? winner : null;
    }

    function diamond(cx, cy, w, h, color, stroke = "rgba(31,36,40,.08)") {
      ctx.beginPath();
      ctx.moveTo(cx, cy - h / 2);
      ctx.lineTo(cx + w / 2, cy);
      ctx.lineTo(cx, cy + h / 2);
      ctx.lineTo(cx - w / 2, cy);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }

    function shade(hex, amount) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, Math.min(255, (n >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (n & 255) + amount));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function drawBase() {
      ctx.clearRect(0, 0, scene.w, scene.h);
      const sky = ctx.createLinearGradient(0, 0, 0, scene.h);
      sky.addColorStop(0, "#9fd1e2");
      sky.addColorStop(.45, "#e7f0d0");
      sky.addColorStop(1, "#a5c96f");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, scene.w, scene.h);

      drawClouds();
      drawBirds();

      for (let x = -7; x <= 7; x++) {
        for (let y = -6; y <= 6; y++) {
          const p = iso(x, y);
          const odd = (x + y) % 2 === 0;
          diamond(p.x, p.y, scene.tileW, scene.tileH, odd ? "#b9d68a" : "#acd07c");
        }
      }

      drawRiver();
      drawRoads();
      drawRouteGlow();
    }

    function drawRiver() {
      ctx.save();
      ctx.globalAlpha = .92;
      ctx.fillStyle = "#78b8c7";
      ctx.beginPath();
      const points = [
        iso(5.8, -6), iso(7.3, -4.2), iso(5.2, 5.9), iso(3.6, 6.6),
        iso(4.5, 1.8), iso(4.2, -2.8)
      ];
      ctx.moveTo(points[0].x, points[0].y);
      points.forEach((p) => ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(30,80,100,.16)";
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.32)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        const drift = Math.sin(time * 1.8 + i) * 16;
        const a = iso(4.15 + i * .32, -4.9 + i * 1.7);
        const b = iso(5.1 + i * .25, -3.7 + i * 1.55);
        ctx.moveTo(a.x + drift, a.y);
        ctx.lineTo(b.x + drift, b.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRoads() {
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#efe2bd";
      ctx.lineWidth = Math.max(16, scene.tileW * .18);
      pathLine([[-5, -2], [-2, -1], [0, 0], [2, -4]]);
      pathLine([[0, 0], [2, 1], [4, 2]]);
      pathLine([[-3, 3], [-1, 2], [0, 0]]);
      ctx.strokeStyle = "rgba(109,88,45,.16)";
      ctx.lineWidth = 2;
      pathLine([[-5, -2], [-2, -1], [0, 0], [2, -4]]);
      pathLine([[0, 0], [2, 1], [4, 2]]);
      pathLine([[-3, 3], [-1, 2], [0, 0]]);
    }

    function drawRouteGlow() {
      if (Math.abs(player.targetX - player.gridX) + Math.abs(player.targetY - player.gridY) < .08) return;
      const start = iso(player.gridX, player.gridY, 6);
      const end = iso(player.targetX, player.targetY, 6);
      ctx.save();
      ctx.setLineDash([10, 10]);
      ctx.lineDashOffset = -time * 36;
      ctx.strokeStyle = "rgba(249,115,22,.75)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
      ctx.restore();
    }

    function pathLine(points) {
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        const p = iso(x, y, 1);
        if (index === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
    }

    function drawBuilding(location) {
      const p = iso(location.grid.x, location.grid.y);
      const hover = hoverId === location.id;
      const active = selected.id === location.id;
      const pulse = active ? 1 + Math.sin(time * 4) * .035 : 1;
      const baseW = scene.tileW * (active ? 1.16 : 1.04) * pulse;
      const baseH = scene.tileH * (active ? 1.16 : 1.04) * pulse;
      const height = scene.tileW * (location.id === "work" ? .95 : .68) * pulse;
      const topY = p.y - height;
      const color = location.color;

      ctx.save();
      ctx.shadowColor = "rgba(31,36,40,.2)";
      ctx.shadowBlur = active || hover ? 24 : 15;
      ctx.shadowOffsetY = 12;
      diamond(p.x, p.y + 7, baseW * 1.14, baseH * 1.14, "rgba(255,255,255,.58)", active ? "#1f2428" : "rgba(31,36,40,.12)");
      ctx.shadowColor = "transparent";

      ctx.fillStyle = "rgba(31,36,40,.12)";
      ellipse(p.x + baseW * .08, p.y + baseH * .56, baseW * .52, baseH * .28);

      ctx.fillStyle = shade(color, -18);
      ctx.beginPath();
      ctx.moveTo(p.x - baseW / 2, p.y);
      ctx.lineTo(p.x, p.y + baseH / 2);
      ctx.lineTo(p.x, topY + baseH / 2);
      ctx.lineTo(p.x - baseW / 2, topY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = shade(color, -34);
      ctx.beginPath();
      ctx.moveTo(p.x + baseW / 2, p.y);
      ctx.lineTo(p.x, p.y + baseH / 2);
      ctx.lineTo(p.x, topY + baseH / 2);
      ctx.lineTo(p.x + baseW / 2, topY);
      ctx.closePath();
      ctx.fill();

      const front = ctx.createLinearGradient(p.x, topY, p.x, p.y + baseH * .5);
      front.addColorStop(0, shade(color, 22));
      front.addColorStop(1, color);
      ctx.fillStyle = front;
      ctx.beginPath();
      ctx.moveTo(p.x - baseW / 2, topY);
      ctx.lineTo(p.x, topY + baseH / 2);
      ctx.lineTo(p.x + baseW / 2, topY);
      ctx.lineTo(p.x, topY - baseH / 2);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = .42;
      ctx.strokeStyle = "rgba(255,255,255,.6)";
      ctx.beginPath();
      ctx.moveTo(p.x - baseW / 2, topY);
      ctx.lineTo(p.x, topY + baseH / 2);
      ctx.lineTo(p.x + baseW / 2, topY);
      ctx.stroke();
      ctx.globalAlpha = 1;

      diamond(p.x, topY, baseW, baseH, location.roof, "rgba(31,36,40,.18)");
      drawRoofDetails(location, p.x, topY, baseW, baseH, height);
      drawWindows(p.x, topY, baseW, baseH, height, location.id);
      drawDoor(location, p.x, topY, baseW, baseH, height);

      if (active) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${.55 + Math.sin(time * 5) * .18})`;
        ctx.lineWidth = 3;
        diamond(p.x, p.y + 7, baseW * 1.35, baseH * 1.35, "rgba(255,255,255,0)", "rgba(255,255,255,.72)");
      }

      ctx.fillStyle = "#1f2428";
      ctx.font = "800 14px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(location.title, p.x, p.y + baseH / 2 + 22);
      if (location.notes.length) {
        ctx.fillStyle = "#1f2428";
        circle(p.x + baseW * .45, topY - baseH * .2, 15);
        ctx.fillStyle = "#fff";
        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillText(String(location.notes.length), p.x + baseW * .45, topY - baseH * .2 + 4);
      }
      ctx.restore();
    }

    function drawRoofDetails(location, x, topY, w, h, height) {
      ctx.save();
      if (location.id === "home") {
        ctx.fillStyle = "rgba(255,255,255,.55)";
        roundedRect(x - w * .1, topY - h * .08, w * .2, h * .12, 4);
        ctx.fillStyle = "#6b3d34";
        roundedRect(x + w * .18, topY - h * .22, w * .08, height * .18, 3);
      }
      if (location.id === "work") {
        ctx.fillStyle = "rgba(255,255,255,.7)";
        for (let i = -2; i <= 2; i++) {
          roundedRect(x + i * w * .11 - 5, topY - h * .1, 10, 18, 3);
        }
        ctx.strokeStyle = "rgba(255,255,255,.65)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, topY - h * .18);
        ctx.lineTo(x, topY - h * .55);
        ctx.stroke();
        ctx.fillStyle = "#fffbeb";
        circle(x, topY - h * .6, 4 + Math.sin(time * 6) * 1.5);
      }
      if (location.id === "city") {
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, topY, w * .22, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (location.id === "park") {
        ctx.fillStyle = "#3f8a58";
        circle(x - w * .18, topY - h * .06, 13);
        circle(x + w * .1, topY - h * .08, 16);
        ctx.fillStyle = "#7bcf83";
        circle(x, topY + h * .02, 12);
      }
      ctx.restore();
    }

    function drawDoor(location, x, topY, w, h, height) {
      ctx.save();
      const doorY = topY + height * .66;
      ctx.fillStyle = "rgba(31,36,40,.55)";
      roundedRect(x - w * .055, doorY, w * .11, height * .22, 5);
      ctx.fillStyle = location.id === "hospital" ? "#fff" : "rgba(255,255,255,.72)";
      circle(x + w * .028, doorY + height * .11, 2.2);
      if (location.id === "city") {
        ctx.strokeStyle = "rgba(31,36,40,.28)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - w * .25, doorY + height * .22);
        ctx.lineTo(x + w * .25, doorY + height * .22);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawWindows(x, topY, w, h, height, id) {
      ctx.fillStyle = `rgba(255,255,255,${.58 + Math.sin(time * 3) * .1})`;
      const rows = id === "work" ? 3 : 2;
      for (let i = 0; i < rows; i++) {
        const y = topY + h * .35 + i * height / (rows + 1);
        roundedRect(x - w * .2, y, w * .13, 9, 3);
        roundedRect(x + w * .07, y, w * .13, 9, 3);
        ctx.fillStyle = "rgba(255,221,120,.55)";
        if ((i + Math.floor(time * 2)) % 2 === 0) roundedRect(x - w * .2, y, w * .13, 9, 3);
        ctx.fillStyle = `rgba(255,255,255,${.58 + Math.sin(time * 3) * .1})`;
      }
      if (id === "hospital") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(x - 5, topY + h * .12, 10, 30);
        ctx.fillRect(x - 16, topY + h * .12 + 10, 32, 10);
      }
    }

    function drawBench(item) {
      const p = iso(item.x, item.y);
      const s = item.s * scene.tileW / 92;
      ctx.fillStyle = "#7a4f36";
      roundedRect(p.x - 22 * s, p.y - 17 * s, 44 * s, 8 * s, 3 * s);
      roundedRect(p.x - 20 * s, p.y - 7 * s, 40 * s, 8 * s, 3 * s);
      ctx.strokeStyle = "#4f3427";
      ctx.lineWidth = 3 * s;
      ctx.beginPath();
      ctx.moveTo(p.x - 15 * s, p.y);
      ctx.lineTo(p.x - 20 * s, p.y + 13 * s);
      ctx.moveTo(p.x + 15 * s, p.y);
      ctx.lineTo(p.x + 20 * s, p.y + 13 * s);
      ctx.stroke();
    }

    function drawLamp(item) {
      const p = iso(item.x, item.y);
      const s = item.s * scene.tileW / 92;
      ctx.strokeStyle = "#3b3f43";
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x, p.y - 45 * s);
      ctx.stroke();
      ctx.fillStyle = `rgba(255, 221, 120, ${.55 + Math.sin(time * 4 + item.x) * .18})`;
      circle(p.x, p.y - 51 * s, 12 * s);
      ctx.fillStyle = "#fbbf24";
      circle(p.x, p.y - 51 * s, 5 * s);
    }

    function drawFountain(item) {
      const p = iso(item.x, item.y);
      const s = item.s * scene.tileW / 92;
      ctx.fillStyle = "#88a3aa";
      ellipse(p.x, p.y - 4 * s, 40 * s, 18 * s);
      ctx.fillStyle = "#70bfd2";
      ellipse(p.x, p.y - 9 * s, 30 * s, 12 * s);
      ctx.strokeStyle = "rgba(255,255,255,.82)";
      ctx.lineWidth = 2 * s;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(p.x, p.y - 18 * s, (10 + i * 7 + Math.sin(time * 5 + i) * 2) * s, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      }
    }

    function drawTree(item) {
      const p = iso(item.x, item.y);
      const s = item.s * scene.tileW / 92;
      ctx.fillStyle = "#76513a";
      ctx.fillRect(p.x - 4 * s, p.y - 30 * s, 8 * s, 30 * s);
      ctx.fillStyle = "#3f8a58";
      circle(p.x, p.y - 42 * s, 19 * s);
      ctx.fillStyle = "#62a765";
      circle(p.x - 12 * s, p.y - 32 * s, 15 * s);
      circle(p.x + 13 * s, p.y - 32 * s, 14 * s);
    }

    function drawRock(item) {
      const p = iso(item.x, item.y);
      ctx.fillStyle = "#879188";
      ellipse(p.x, p.y - 8, 18 * item.s, 10 * item.s);
      ctx.fillStyle = "#aeb6ae";
      ellipse(p.x - 5, p.y - 12, 10 * item.s, 6 * item.s);
    }

    function drawFlower(item) {
      const p = iso(item.x, item.y);
      ["#f26c72", "#ffe08a", "#fff"].forEach((color, index) => {
        ctx.fillStyle = color;
        circle(p.x + index * 9 - 8, p.y - 10 - (index % 2) * 5, 4);
      });
    }

    function drawPerson(x, y, color, scale = 1, wave = 0) {
      const p = iso(x, y, 4);
      const s = scale * scene.tileW / 92;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = "rgba(31,36,40,.18)";
      ellipse(0, 9 * s, 12 * s, 5 * s);
      ctx.strokeStyle = "#1f2428";
      ctx.lineWidth = 3 * s;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-3 * s, -4 * s);
      ctx.lineTo(-8 * s, 10 * s);
      ctx.moveTo(3 * s, -4 * s);
      ctx.lineTo(8 * s, 10 * s);
      ctx.moveTo(-6 * s, -15 * s);
      ctx.lineTo(-13 * s, -7 * s + Math.sin(wave) * 4 * s);
      ctx.moveTo(6 * s, -15 * s);
      ctx.lineTo(13 * s, -7 * s - Math.sin(wave) * 4 * s);
      ctx.stroke();
      ctx.fillStyle = color;
      roundedRect(-9 * s, -27 * s, 18 * s, 24 * s, 7 * s);
      ctx.fillStyle = "#f0c59c";
      circle(0, -38 * s, 10 * s);
      ctx.fillStyle = "#2f2520";
      ellipse(0, -44 * s, 10 * s, 5 * s);
      ctx.restore();
    }

    function drawVehicle(vehicle) {
      vehicle.t = (vehicle.t + vehicle.speed * 16) % 1;
      const pos = pointOnRoute(vehicle.route, vehicle.t);
      const ahead = pointOnRoute(vehicle.route, (vehicle.t + .015) % 1);
      const p = iso(pos.x, pos.y, 5);
      const q = iso(ahead.x, ahead.y, 5);
      const angle = Math.atan2(q.y - p.y, q.x - p.x);
      const s = scene.tileW / 92;
      ctx.save();
      ctx.translate(p.x, p.y - 7 * s);
      ctx.rotate(angle);
      ctx.fillStyle = "rgba(31,36,40,.18)";
      ellipse(0, 12 * s, 24 * s, 7 * s);
      ctx.fillStyle = vehicle.color;
      roundedRect(-22 * s, -11 * s, 44 * s, 22 * s, 7 * s);
      ctx.fillStyle = "rgba(255,255,255,.72)";
      roundedRect(-7 * s, -17 * s, 18 * s, 12 * s, 4 * s);
      ctx.fillStyle = "#202124";
      circle(-13 * s, 12 * s, 4 * s);
      circle(14 * s, 12 * s, 4 * s);
      ctx.restore();
    }

    function pointOnRoute(route, t) {
      const segments = route.length - 1;
      const scaled = t * segments;
      const index = Math.min(route.length - 2, Math.floor(scaled));
      const local = scaled - index;
      const a = route[index];
      const b = route[index + 1];
      return {
        x: a[0] + (b[0] - a[0]) * local,
        y: a[1] + (b[1] - a[1]) * local
      };
    }

    function drawClouds() {
      ctx.save();
      ctx.globalAlpha = .28;
      ctx.fillStyle = "#fff";
      for (const cloud of clouds) {
        const drift = ((cloud.x + time * cloud.speed * 100) % 1.18) - .09;
        const x = drift * scene.w;
        const y = cloud.y * scene.h;
        const s = cloud.s;
        circle(x, y, 42 * s);
        circle(x + 44 * s, y + 5 * s, 35 * s);
        circle(x - 38 * s, y + 7 * s, 28 * s);
      }
      ctx.restore();
    }

    function drawBirds() {
      ctx.save();
      ctx.strokeStyle = "rgba(31,36,40,.42)";
      ctx.lineWidth = 2;
      for (const bird of birds) {
        const x = ((bird.x + time * bird.speed * 100) % 1.1) * scene.w;
        const y = bird.y * scene.h + Math.sin(time * 2 + bird.phase) * 12;
        const flap = Math.sin(time * 9 + bird.phase) * 5;
        ctx.beginPath();
        ctx.moveTo(x - 12, y);
        ctx.quadraticCurveTo(x - 5, y - 8 - flap, x, y);
        ctx.quadraticCurveTo(x + 5, y - 8 + flap, x + 12, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      ctx.save();
      for (const particle of particles) {
        const p = iso(particle.x + Math.sin(time + particle.phase) * .08, particle.y);
        const alpha = .28 + Math.sin(time * 3 + particle.phase) * .18;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        circle(p.x, p.y - 34 - Math.sin(time * 2 + particle.phase) * 10, 3.5);
      }
      ctx.restore();
    }

    function circle(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function ellipse(x, y, rx, ry) {
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function drawScene() {
      time += .016;
      const ease = .06;
      player.gridX += (player.targetX - player.gridX) * ease;
      player.gridY += (player.targetY - player.gridY) * ease;
      scene.cameraX += ((-player.gridX * scene.tileW * .08) - scene.cameraX) * .025;
      scene.cameraY += ((-player.gridY * scene.tileH * .08) - scene.cameraY) * .025;
      if (Math.hypot(player.targetX - player.gridX, player.targetY - player.gridY) > .04) {
        player.trail.push({ x: player.gridX, y: player.gridY, life: 1 });
      }
      player.trail = player.trail.filter((dot) => {
        dot.life -= .025;
        return dot.life > 0;
      }).slice(-32);
      drawBase();

      const objects = [
        ...decor,
        ...locations.map((location) => ({ type: "building", location, x: location.grid.x, y: location.grid.y })),
        ...walkers.map((walker) => {
          const radius = .55 + Math.sin(time + walker.phase) * .05;
          return {
            type: "walker",
            x: walker.x + Math.cos(time * .7 + walker.phase) * radius,
            y: walker.y + Math.sin(time * .7 + walker.phase) * radius,
            color: walker.color
          };
        }),
        ...vehicles.map((vehicle) => {
          const pos = pointOnRoute(vehicle.route, vehicle.t);
          return { type: "vehicle", vehicle, x: pos.x, y: pos.y };
        }),
        ...player.trail.map((dot) => ({ type: "trail", x: dot.x, y: dot.y, life: dot.life })),
        { type: "player", x: player.gridX, y: player.gridY }
      ];

      objects.sort((a, b) => (a.x + a.y) - (b.x + b.y));
      for (const object of objects) {
        if (object.type === "tree") drawTree(object);
        if (object.type === "rock") drawRock(object);
        if (object.type === "flower") drawFlower(object);
        if (object.type === "bench") drawBench(object);
        if (object.type === "lamp") drawLamp(object);
        if (object.type === "fountain") drawFountain(object);
        if (object.type === "building") drawBuilding(object.location);
        if (object.type === "walker") drawPerson(object.x, object.y, object.color, .75, time * 5 + object.x);
        if (object.type === "vehicle") drawVehicle(object.vehicle);
        if (object.type === "trail") {
          const p = iso(object.x, object.y, 2);
          ctx.fillStyle = `rgba(249,115,22,${object.life * .3})`;
          circle(p.x, p.y, 8 * object.life);
        }
        if (object.type === "player") drawPerson(object.x, object.y, "#f97316", 1, time * 7);
      }
      drawParticles();

      requestAnimationFrame(drawScene);
    }

    function selectLocation(id, fromWorld = false) {
      const next = locations.find((location) => location.id === id);
      if (!next) return;
      selected = next;
      player.targetX = next.grid.x;
      player.targetY = next.grid.y;
      els.title.textContent = selected.title;
      els.type.textContent = selected.kind;
      els.text.textContent = selected.text;
      els.focusBar.style.width = `${selected.focus}%`;
      els.loadBar.style.width = `${selected.load}%`;
      renderNotes();
      if (fromWorld) addJournal(`Персонаж идет в "${selected.title}".`);
    }

    function renderNotes() {
      els.notes.innerHTML = "";
      selected.notes.forEach((note) => {
        const item = document.createElement("label");
        item.className = "note";
        item.innerHTML = `<input type="checkbox"><span>${note}</span>`;
        item.querySelector("input").addEventListener("change", (event) => {
          item.classList.toggle("done", event.target.checked);
          energy = Math.max(0, Math.min(100, energy + (event.target.checked ? 3 : -3)));
          renderStatus();
        });
        item.addEventListener("dblclick", () => {
          events.push({ day: currentDay, location: selected.id, text: note });
          energy = Math.max(0, energy - Math.round(selected.load / 24));
          addJournal(`"${note}" добавлено на ${days[currentDay].toLowerCase()}.`);
          renderWeek();
        });
        els.notes.appendChild(item);
      });
    }

    function renderWeek() {
      els.week.innerHTML = "";
      shortDays.forEach((day, index) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day";
        cell.classList.toggle("active", index === currentDay);
        cell.innerHTML = `<strong>${day}</strong>`;
        events.filter((event) => event.day === index).forEach((event) => {
          const badge = document.createElement("span");
          badge.className = `event ${event.location}`;
          badge.textContent = taskText(event);
          cell.appendChild(badge);
        });
        cell.addEventListener("click", () => {
          currentDay = index;
          els.daySelect.value = String(index);
          renderWeek();
        });
        els.week.appendChild(cell);
      });
      renderStatus();
    }

    function taskText(event) {
      const location = locations.find((item) => item.id === event.location);
      return `${location.title}: ${event.text}`;
    }

    function renderStatus() {
      els.dayChip.textContent = days[currentDay];
      els.energyChip.textContent = `Энергия ${energy}`;
      els.planChip.textContent = `${events.length} дела`;
    }

    function addJournal(message) {
      const row = document.createElement("span");
      row.textContent = `${shortDays[currentDay]} · ${message}`;
      els.log.prepend(row);
      while (els.log.children.length > 6) els.log.lastElementChild.remove();
    }

    canvas.addEventListener("mousemove", (event) => {
      const target = closestLocation(gridFromPointer(event.clientX, event.clientY));
      hoverId = target ? target.id : "";
      canvas.style.cursor = target ? "pointer" : "default";
    });

    canvas.addEventListener("click", (event) => {
      const target = closestLocation(gridFromPointer(event.clientX, event.clientY));
      if (target) selectLocation(target.id, true);
    });

    els.noteForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = els.noteInput.value.trim();
      if (!value) return;
      selected.notes.push(value);
      els.noteInput.value = "";
      addJournal(`Новая заметка прикреплена к "${selected.title}".`);
      renderNotes();
    });

    document.querySelector('[data-action="plan"]').addEventListener("click", () => {
      const firstNote = selected.notes[0] || "Свободный блок";
      currentDay = Number(els.daySelect.value);
      events.push({ day: currentDay, location: selected.id, text: firstNote });
      energy = Math.max(0, energy - Math.round(selected.load / 20));
      addJournal(`План в "${selected.title}" поставлен на ${days[currentDay].toLowerCase()}.`);
      renderWeek();
    });

    document.querySelector('[data-action="advance"]').addEventListener("click", () => {
      currentDay = (currentDay + 1) % days.length;
      els.daySelect.value = String(currentDay);
      energy = Math.min(100, energy + (currentDay >= 5 ? 8 : 2));
      addJournal(`Наступает ${days[currentDay].toLowerCase()}.`);
      renderWeek();
    });

    document.querySelector('[data-action="reset"]').addEventListener("click", () => {
      currentDay = 0;
      energy = 72;
      events = [];
      els.daySelect.value = "0";
      addJournal("Неделя очищена, город выдохнул.");
      renderWeek();
    });

    els.daySelect.addEventListener("change", () => {
      currentDay = Number(els.daySelect.value);
      renderWeek();
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    selectLocation("home");
    renderWeek();
    addJournal("3D-город запущен.");
    requestAnimationFrame(drawScene);
  </script>
</body>
</html>
